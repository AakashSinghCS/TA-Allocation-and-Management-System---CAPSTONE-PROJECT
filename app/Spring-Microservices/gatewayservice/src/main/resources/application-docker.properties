eureka.client.service-url.defaultZone=http://service-registry:8761/eureka

spring.cloud.gateway.routes[0].id=USER-SERVICE
spring.cloud.gateway.routes[0].uri=http://user-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**,/students/**, /auth/**

spring.cloud.gateway.routes[1].id=COURSE-SERVICE
spring.cloud.gateway.routes[1].uri=http://course-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/courses/**,/enrollments/**

spring.cloud.gateway.routes[2].id=APPLICATION-SERVICE
spring.cloud.gateway.routes[2].uri=http://application-service:8084
spring.cloud.gateway.routes[2].predicates[0]=Path=/applications/**,/allocations/**, /transcripts/**, /offers/**