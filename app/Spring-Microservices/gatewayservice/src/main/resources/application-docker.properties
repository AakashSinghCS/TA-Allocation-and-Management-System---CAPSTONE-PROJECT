eureka.client.service-url.defaultZone=http://service-registry:8761/eureka

spring.cloud.gateway.routes[0].id=USER-SERVICE
spring.cloud.gateway.routes[0].uri=http://user-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**,/students/**, /auth/**, /instructors/**

spring.cloud.gateway.routes[1].id=COURSE-SERVICE
spring.cloud.gateway.routes[1].uri=http://course-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/courses/**,/enrollments/**,/qualifications/**, /needs/**, /sections/**

spring.cloud.gateway.routes[2].id=PROFILE-SERVICE
spring.cloud.gateway.routes[2].uri=http://profile-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/admin/**,/profiles/**

spring.cloud.gateway.routes[3].id=APPLICATION-SERVICE
spring.cloud.gateway.routes[3].uri=http://application-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/applications/**,/allocations/**, /transcripts/**, /offers/**