services:
  frontend:
    container_name: frontend
    build:
      context: ./app/TA-portal-infinity
      dockerfile: Dockerfile
    volumes:
      - ./app/TA-portal-infinity:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 #0.0.0.0 means listen on all network interfaces inside the container. -- means to pass '--host 0.0.0.0' to VITE and not run it in npm.
    environment:
      VITE_HOST: "0.0.0.0"
      NODE_ENV: "development"
      CHOKIDAR_USEPOLLING: "true"
  gateway-service:
    build: 
      context: ./app/Spring-Microservices/gatewayservice
      dockerfile: Dockerfile
    container_name: gateway-service
    depends_on:
      service-registry:
          condition: service_healthy 
    ports: 
      - 8080:8080
  service-registry:
    build: 
      context: ./app/Spring-Microservices/serviceregistry
      dockerfile: Dockerfile
    container_name: eureka
    ports: 
      - 8761:8761
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 2s
      timeout: 3s
      retries: 10
  user-service:
    build: 
      context: ./app/Spring-Microservices/userservice
      dockerfile: Dockerfile
    container_name: user-service
    ports: 
      - 8081:8081
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db
      SPRING_DATASOURCE_USERNAME: dev_user
      SPRING_DATASOURCE_PASSWORD: secret
    
  course-service:
    build: 
      context: ./app/Spring-Microservices/courseservice
      dockerfile: Dockerfile
    container_name: course-service
    ports: 
      - 8082:8082
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/course_db
      SPRING_DATASOURCE_USERNAME: dev_user
      SPRING_DATASOURCE_PASSWORD: secret
  profile-service:
    build:
      context: ./app/Spring-Microservices/profileservice
      dockerfile: Dockerfile
    container_name: profile-service
    ports:
      - 8083:8083           # hostPort:containerPort
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/profiles_db
      SPRING_DATASOURCE_USERNAME: dev_user
      SPRING_DATASOURCE_PASSWORD: secret
  mysql:
    image: 'mysql:latest'
    container_name: mysql
    environment:
      - 'MYSQL_ROOT_PASSWORD=verysecret'
    ports:
      - '3306:3306'
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 10
volumes:
  node_modules: